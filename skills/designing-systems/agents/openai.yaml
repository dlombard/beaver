interface:
  display_name: "Designing Systems"
  short_description: "Design or review the architecture of any system, product, or platform"
  default_prompt: "Use $designing-systems to turn this idea into a high-level system design — works for software, data/ML/AI, IoT/edge/embedded, or cyber-physical/hardware systems — with a constraint register, building-block selections, SRD seed, component boundaries, quality attributes, risks, and a next-phase spec/SRD backlog. Do not write a full SRD or feature specs."
